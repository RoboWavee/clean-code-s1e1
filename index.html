<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <header class="header">
      <img class="header__img" src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix">
      <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="app">
      <section class="add-task">
        <label class="add-task__label" for="new-task">Add Item</label>
        <div class="add-task__form">
          <input id="new-task" class="app-task" type="text">
          <button class="btn-add">Add</button>
        </div>
      </section>
      <section class="tasks">
        <h3 class="tasks__title">Todo</h3>
        <ul id="tasks__list-incompleted" class="tasks__list">
          <li>
            <input class="task__check" type="checkbox">
            <label class="app-task">Pay Bills</label> 
            <input type="text" class="app-task">
            <button class="btn-edit">Edit</button>
            <button class="btn-delete">
              <img class="btn-delete__img" src="./remove.svg" alt="Delete icon">
            </button></li>
          <li class="tasks__item_edit-mode">
            <input class="task__check" type="checkbox">
            <label class="app-task">Go Shopping</label>
            <input type="text" value="Go Shopping" class="app-task">
            <button class="btn-edit">Save</button>
            <button class="btn-delete">
              <img class="btn-delete__img" src="./remove.svg" alt="Delete icon">
            </button>
          </li>
        </ul>
      </section>
      <section class="tasks">
        <h3 class="tasks__title">Completed</h3>
        <ul id="tasks__list-completed" class="tasks__list">
          <li>
            <input class="task__check" type="checkbox" checked>
            <label class="app-task">See the Doctor</label>
            <input type="text" class="app-task">
            <button class="btn-edit">Edit</button>
            <button class="btn-delete">
              <img class="btn-delete__img" src="./remove.svg" alt="Delete icon">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
