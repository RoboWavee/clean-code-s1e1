<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <!-- header  -->
    <div class="header">
      <img class="header__img" src="./eisenhower-matrix.jpg">
      <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>




    <div class="todo-app"> <!-- <main class="todo-app">  -->

      <p class="add-task">  <!-- <section class="add-task"> -->
        <label for="new-task" class="add-task__label">Add Item</label>
        <div class="add-task__form">
          <input id="new-task" class="add__input input" type="text">
          <button class="btn-add">Add</button>
        </div>
      </p>                  <!-- </section> -->
    
    
      <!-- <section class="tasks"> -->
      <h3 class="tasks__title">Todo</h3>
      <ul id="tasks__list-incompleted" class="tasks__list">
        <li class="task-item">
          <input class="task__check" type="checkbox">
          <label class="task__label">Pay Bills</label>
          <input type="text" class="task__input input">
          <button class="btn-edit">Edit</button>
          <button class="btn-delete">
            <img src="./remove.svg">
          </button>
        </li>
        <li class="task-item task-edit"> 
          <input class="task__check" type="checkbox">
          <label class="task__label">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task__input input">
          <button class="btn-edit">Save</button>
          <button class="btn-delete">
            <img src="./remove.svg">
          </button>
        </li>
      </ul>
      <!-- </section> -->

      <!-- <section class="tasks"> -->
      <h3 class="tasks__title">Completed</h3>
      <ul id="tasks__list-completed" class="tasks__list">
        <li class="task-item">
          <input class="task__check" type="checkbox" checked>
          <label class="task__label">See the Doctor</label>
          <input type="text" class="task__input input">
          <button class="btn-edit">Edit</button>
          <button class="btn-delete">
            <img src="./remove.svg">
          </button>
        </li>
      </ul>
      <!-- </section> -->
      
    </div>
  <script src="app.js"></script>
  </body>
</html>
